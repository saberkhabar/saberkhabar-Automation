
name: Bale Approval Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Send approval buttons
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
        run: python bale_approval_test.py
