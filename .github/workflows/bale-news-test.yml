
name: Bale News Test

on:
  workflow_dispatch:

jobs:
  send-one-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests beautifulsoup4

      - name: Search and send one test news
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
        run: python bale_news_test.py
