
name: Bale Photo Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests pillow

      - name: Send test photo
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
        run: python bale_photo_test.py
