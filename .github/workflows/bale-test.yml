
name: Bale Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run Bale Test
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
        run: python bale_test.py
