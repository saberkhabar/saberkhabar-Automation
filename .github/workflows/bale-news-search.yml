
name: Bale News Search

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  search-news:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install requests

      - name: Search Shفت News
        run: python bale_news_search.py
